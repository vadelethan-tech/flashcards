<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Flashcards</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background-color: #f4f4f4;
        }
        #card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            font-size: 22px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<h2>Flashcards</h2>

<div id="card">Tap Start</div>

<button onclick="start()">Start</button>

<script>
const qaList = [
    ["100 ?", "Secrecy and access."],
    ["200 ?", "Application types."],
    ["300 ?", "Ownership and assignment."],
    ["400 ?", "Representative of owner or applicant."],
    ["500 ?", "Receipt of mail and papers."],
    ["600 ?", "Content of application."],
    ["700 ?", "Examination."],
    ["800 ?", "Double patenting and restriction."],
    ["900 ?", "Prior art."],
    ["1000 ?", "Matters decided by USPTO officials."],
    ["1100 ?", "SIR, PGPub, Preissuance Submissions."],
    ["1200 ?", "Appeal."],
    ["1300 ?", "Allowance and issue."],
    ["1400 ?", "Corrections and reissue."],
    ["1500 ?", "Design patents."],
    ["1600 ?", "Plant patents."],
    ["1800 ?", "PCT."],
    ["1900 ?", "Protest."],
    ["2000 ?", "Duty of disclosure."],
    ["2100 ?", "Patentability."],
    ["2200 ?", "Ex parte reexamination."],
    ["2300 ?", "Interference and derivation proceedings."],
    ["2400 ?", "Biotechnology."],
    ["2500 ?", "Maintenance fees."],
    ["2600 ?", "Inter partes reexamination."],
    ["2700 ?", "Patent term, adjustments, and extensions."],
    ["2800 ?", "Supplemental examination."]
];

let current = [];

function speak(text) {
    const msg = new SpeechSynthesisUtterance(text);
    msg.rate = 0.9;
    speechSynthesis.speak(msg);
}

function start() {
    nextQuestion();
}

function nextQuestion() {
    current = qaList[Math.floor(Math.random() * qaList.length)];
    document.getElementById("card").innerText = current[0];
    speak(current[0]);

    setTimeout(showAnswer, 3000);
}

function showAnswer() {
    document.getElementById("card").innerText = "Answer:\n\n" + current[1];
    speak(current[1]);

    setTimeout(nextQuestion, 3000);
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(() => console.log('Service Worker registered successfully.'))
    .catch((err) => console.log('Service Worker registration failed:', err));
}
</script>

</body>
</html>
