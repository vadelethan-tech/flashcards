<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f4f4f4;
        padding: 20px;
    }
    #question {
        background: white;
        padding: 25px;
        border-radius: 10px;
        font-size: 22px;
        min-height: 80px;
        margin-bottom: 15px;
    }
    #answer {
        background: #eef;
        padding: 20px;
        border-radius: 10px;
        font-size: 18px;
        min-height: 80px;
        display: none;
        margin-bottom: 20px;
    }
    button {
        font-size: 18px;
        padding: 10px 20px;
        margin: 5px;
    }
</style>
</head>

<body>

<h2>Interview Flashcards</h2>

<div id="question">Click Start</div>
<div id="answer"></div>

<button onclick="showAnswer()">Show Answer</button>
<button onclick="nextCard()">Next</button>

<script>
const cards = [
  ["chapter 100", "Secrecy, Access, National Security, and Foreign Filing"],
["chapter 200", "Types and Status of Application; Benefit and Priority Claims"],
["chapter 300", "Ownership and Assignment"],
["chapter 400", "Representative of Applicant or Owner"],
["chapter 500", "Receipt and Handling of Mail and Papers"],
["chapter 600", "Parts, Form, and Content of Application"],
["chapter 700", "Examination of Applications"],
["chapter 800", "Restriction in Applications; Double Patenting"],
["chapter 900", "Prior Art, Classification, and Search"],
["chapter 1000", "Matters Decided by Various USPTO Officials"],
["chapter 1100", "Pre-Grant Publication and Preissuance Submissions"],
["chapter 1200", "Appeal"],
["chapter 1300", "Allowance and Issue"],
["chapter 1400", "Correction of Patents"],
["chapter 1500", "Design Patents"],
["chapter 1600", "Plant Patents"],
["chapter 1700", "Miscellaneous"],
["chapter 1800", "Patent Cooperation Treaty (PCT)"],
["chapter 1900", "Protest"],
["chapter 2000", "Duty of Disclosure"],
["chapter 2100", "Patentability"],
["chapter 2200", "Citation of Prior Art and Ex Parte Reexamination"],
["chapter 2300", "Derivation Proceedings"],
["chapter 2400", "Biotechnology"],
["chapter 2500", "Maintenance Fees"],
["chapter 2600", "Inter Partes Reexamination"],
["chapter 2700", "Patent Terms, Adjustments, and Extensions"],
["chapter 2800", "Supplemental Examination"],
["chapter 2900", "International Design Applications"]
];

let index = 0;


function renderQuestion() {
    document.getElementById("question").innerText = cards[index][0];
    document.getElementById("answer").style.display = "none";
    document.getElementById("answer").innerText = "";
}

function showAnswer() {
    document.getElementById("answer").innerText = cards[index][1];
    document.getElementById("answer").style.display = "block";
}

function nextCard() {
    let newIndex;

    do {
        newIndex = Math.floor(Math.random() * cards.length);
    } while (newIndex === index);

    index = newIndex;
    renderQuestion();
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}
</script>

</body>
</html>
